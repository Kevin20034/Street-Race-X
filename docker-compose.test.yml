services:
  postgres-test:
    image: postgres:16-alpine
    container_name: street-race-x-postgres-test
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: street_race_x_test
    ports:
      - '5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d street_race_x_test']
      interval: 5s
      timeout: 3s
      retries: 10
